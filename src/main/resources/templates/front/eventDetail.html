<html id="hamHtml" lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: commonHead"></head>

<body id="hamBody" class="" data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">
	<div id="container">
		<th:block th:replace="~{fragments/front/common :: commonHeader(white=${false}, dark=${true})}"></th:block>

		<main id="main">
			<div class="main-wrap">
				<section class="bsc_container">
					<section class="subtit-wrap">
						<div class="inner w1280 mt-3">
							<p class="title">EVENT</p>
							<span class="sub-txt">새김성형외과의 EVENT 상세 내용을 확인해 보세요</span><br>
						</div>
					</section>

					<section class="event-page-second-detail-section">
						<div class="inner w1280">
							<div class="event-page-second-detail-card">

								<div class="event-page-second-detail-head">
									<div class="event-page-second-detail-title-area">
										<div class="event-page-second-badge-row">
											<span class="event-page-second-status-badge"
												th:classappend="${event.displayStatus == 'ended'} ? ' event-page-second-ended' : ' event-page-second-ongoing'"
												th:text="${event.displayStatus == 'ended'} ? '종료' : '진행중'">
												진행중
											</span>
											<span class="event-page-second-period-badge" th:text="${event.periodText}">
												상시 진행
											</span>
										</div>

										<h1 class="event-page-second-detail-title" th:text="${event.title}">
											이벤트 제목
										</h1>

										<div class="event-page-second-detail-meta">
											<span th:text="'등록일 ' + ${event.createdAtText}">등록일 -</span>
											<span th:if="${event.updatedAtText != null and event.updatedAtText != ''}"
												th:text="'수정일 ' + ${event.updatedAtText}">수정일 -</span>
										</div>
									</div>

									<div class="event-page-second-detail-action-area">
										<a th:if="${event.hasLink}" th:href="${event.linkUrl}"
											class="event-page-second-detail-link-btn">
											링크 이동
										</a>
										<span th:unless="${event.hasLink}" class="event-page-second-detail-link-empty">
											링크 없음
										</span>

										<a href="/eventPage" class="event-page-second-detail-list-btn">
											목록으로
										</a>
									</div>
								</div>

								<div class="event-page-second-main-image-wrap"
									th:if="${event.imageUrl != null and event.imageUrl != ''}">
									<img th:src="${event.imageUrl}" th:alt="${event.title}"
										class="event-page-second-main-image">
								</div>

								<div class="event-page-second-summary-box"
									th:if="${event.content != null and event.content != ''}">
									<p th:text="${event.content}">이벤트 요약 내용</p>
								</div>

								<div class="event-page-second-html-content"
									th:if="${event.detailHtml != null and event.detailHtml != ''}"
									th:utext="${event.detailHtml}">
								</div>

								<div class="event-page-second-empty-content"
									th:if="${event.detailHtml == null or event.detailHtml == ''}">
									상세 내용이 준비 중입니다.
								</div>

							</div>
						</div>
					</section>
				</section>
			</div>
		</main>

		<footer th:replace="fragments/front/common :: commonFooter"></footer>
	</div>

	<style>
		.event-page-second-detail-section {
			padding: 34px 0 110px 0 !important;
			background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%) !important;
		}

		.event-page-second-detail-card {
			width: 100% !important;
			background: #ffffff !important;
			border: 1px solid rgba(17, 17, 17, 0.08) !important;
			border-radius: 30px !important;
			box-shadow: 0 18px 46px rgba(17, 17, 17, 0.08) !important;
			overflow: hidden !important;
		}

		.event-page-second-detail-head {
			display: flex !important;
			align-items: center !important;
			justify-content: space-between !important;
			gap: 24px !important;
			padding: 34px 36px !important;
			border-bottom: 1px solid #eeeeee !important;
		}

		.event-page-second-detail-title-area {
			flex: 1 1 auto !important;
			min-width: 0 !important;
		}

		.event-page-second-badge-row {
			display: flex !important;
			align-items: center !important;
			gap: 10px !important;
			flex-wrap: wrap !important;
			margin-bottom: 14px !important;
		}

		.event-page-second-status-badge,
		.event-page-second-period-badge {
			min-height: 36px !important;
			padding: 0 15px !important;
			border-radius: 999px !important;
			display: inline-flex !important;
			align-items: center !important;
			justify-content: center !important;
			font-size: 13px !important;
			font-weight: 800 !important;
			line-height: 1 !important;
		}

		.event-page-second-status-badge.event-page-second-ongoing {
			background: #111111 !important;
			color: #ffffff !important;
		}

		.event-page-second-status-badge.event-page-second-ended {
			background: #f1f2f4 !important;
			color: #777777 !important;
		}

		.event-page-second-period-badge {
			background: #f6f6f6 !important;
			color: #222222 !important;
		}

		.event-page-second-detail-title {
			margin: 0 !important;
			font-size: 34px !important;
			font-weight: 800 !important;
			line-height: 1.35 !important;
			letter-spacing: -0.04em !important;
			color: #111111 !important;
			word-break: keep-all !important;
		}

		.event-page-second-detail-meta {
			margin-top: 14px !important;
			display: flex !important;
			align-items: center !important;
			gap: 14px !important;
			flex-wrap: wrap !important;
			font-size: 14px !important;
			color: #777777 !important;
			line-height: 1.6 !important;
		}

		.event-page-second-detail-action-area {
			flex: 0 0 180px !important;
			display: flex !important;
			flex-direction: column !important;
			gap: 10px !important;
		}

		.event-page-second-detail-link-btn,
		.event-page-second-detail-link-empty,
		.event-page-second-detail-list-btn {
			width: 100% !important;
			height: 50px !important;
			border-radius: 16px !important;
			display: inline-flex !important;
			align-items: center !important;
			justify-content: center !important;
			text-decoration: none !important;
			font-size: 15px !important;
			font-weight: 800 !important;
		}

		.event-page-second-detail-link-btn {
			background: #111111 !important;
			color: #ffffff !important;
			box-shadow: 0 14px 26px rgba(17, 17, 17, 0.14) !important;
		}

		.event-page-second-detail-link-empty {
			background: #f4f6f8 !important;
			color: #aaaaaa !important;
		}

		.event-page-second-detail-list-btn {
			background: #ffffff !important;
			color: #111111 !important;
			border: 1px solid #d8d8d8 !important;
		}

		.event-page-second-main-image-wrap {
			width: 100% !important;
			background: #f5f5f5 !important;
			overflow: hidden !important;
		}

		.event-page-second-main-image {
			width: 100% !important;
			max-height: 620px !important;
			object-fit: cover !important;
			display: block !important;
		}

		.event-page-second-summary-box {
			margin: 34px 36px 0 36px !important;
			padding: 22px 24px !important;
			border-radius: 22px !important;
			background: #f7f8fa !important;
			color: #555555 !important;
			font-size: 16px !important;
			line-height: 1.8 !important;
			word-break: keep-all !important;
		}

		.event-page-second-summary-box p {
			margin: 0 !important;
			white-space: pre-line !important;
		}

		.event-page-second-html-content {
			padding: 42px 36px 54px 36px !important;
			font-size: 16px !important;
			line-height: 1.85 !important;
			color: #222222 !important;
			word-break: keep-all !important;
		}

		.event-page-second-html-content img {
			max-width: 100% !important;
			height: auto !important;
			display: block !important;
			margin: 24px auto !important;
			border-radius: 18px !important;
		}

		.event-page-second-html-content figure {
			margin: 24px 0 !important;
		}

		.event-page-second-html-content table {
			width: 100% !important;
			border-collapse: collapse !important;
			margin: 22px 0 !important;
		}

		.event-page-second-html-content table td,
		.event-page-second-html-content table th {
			border: 1px solid #dddddd !important;
			padding: 12px !important;
		}

		.event-page-second-empty-content {
			min-height: 260px !important;
			padding: 60px 36px !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
			text-align: center !important;
			color: #999999 !important;
			font-size: 16px !important;
			font-weight: 700 !important;
		}

		@media (max-width: 991px) {
			.event-page-second-detail-head {
				flex-direction: column !important;
				align-items: stretch !important;
				padding: 28px 22px !important;
			}

			.event-page-second-detail-action-area {
				flex: 0 0 auto !important;
				display: grid !important;
				grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
			}

			.event-page-second-detail-title {
				font-size: 28px !important;
			}

			.event-page-second-summary-box {
				margin: 28px 22px 0 22px !important;
			}

			.event-page-second-html-content {
				padding: 34px 22px 44px 22px !important;
			}
		}

		@media (max-width: 480px) {
			.event-page-second-detail-card {
				border-radius: 22px !important;
			}

			.event-page-second-detail-action-area {
				grid-template-columns: 1fr !important;
			}

			.event-page-second-detail-title {
				font-size: 24px !important;
			}
		}
	</style>

	<th:block th:replace="fragments/front/common :: commonScript"></th:block>
</body>

</html>
