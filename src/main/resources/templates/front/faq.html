<html id="hamHtml" lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/front/common :: commonHead"></head>

<body id="hamBody" class="" data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">
<div id="container">
    <th:block th:replace="~{fragments/front/common :: commonHeader(white=${false}, dark=${true})}"></th:block>

    <main id="main">
        <div class="main-wrap">
            <section class="bsc_container faq-page">
                <section class="subtit-wrap">
                    <div class="inner w1280 mt-3">
                        <p class="title">FAQ</p>
                        <span class="sub-txt">이용시 자주 묻는 질문을 확인해보세요.</span><br>
                    </div>
                </section>

                <section class="default-wrap">
                    <div class="inner w1280">
                        <div class="faq-topic-filter-wrap" aria-label="FAQ 주제 선택">
                            <div class="faq-topic-filter">
                                <a class="faq-topic-filter__item"
                                   th:classappend="${selectedTopicId == null} ? ' is-active' : ''"
                                   th:href="@{/faqPage(page=1, keyword=${keyword})}">
                                    ALL
                                </a>
                                <a class="faq-topic-filter__item"
                                   th:each="topic : ${faqTopics}"
                                   th:classappend="${selectedTopicId != null and selectedTopicId == topic.id} ? ' is-active' : ''"
                                   th:href="@{/faqPage(page=1, keyword=${keyword}, topicId=${topic.id})}"
                                   th:text="${topic.name}">
                                    주제
                                </a>
                            </div>
                        </div>

                        <div class="total-searchBox faq-total-search-box">
                            <div class="total">
                                <p class="total-txt">
                                    Total <span class="total-num" th:text="${totalCount}">0</span>
                                </p>
                            </div>

                            <form name="searchForm" id="searchForm" method="get" th:action="@{/faqPage}">
                                <input type="hidden"
                                       name="topicId"
                                       th:if="${selectedTopicId != null}"
                                       th:value="${selectedTopicId}">
                                <div class="search">
                                    <div class="inputBox">
                                        <input type="text"
                                               name="keyword"
                                               title="검색어"
                                               class="input-txt"
                                               placeholder="검색어를 입력하세요."
                                               th:value="${keyword}">
                                        <button type="submit" value="검색" class="searchBtn" aria-label="FAQ 검색"></button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="faq-list__wrap" th:if="${!faqPage.empty}">
                            <ul class="faq-list">
                                <li class="faq-list__item" th:each="faq : ${faqList}">
                                    <a class="faq-question js-front-faq-question"
                                       th:id="${'Q' + faq.id}"
                                       role="button"
                                       aria-expanded="false"
                                       th:attr="aria-controls=${'A' + faq.id}, data-faq-id=${faq.id}, data-viewed='false'"
                                       href="javascript:void(0);">

                                        <span class="faq-question__icon">Q<em class="blind">질문</em></span>

                                        <strong class="faq-question__text">
                                            <span class="tag-category md faq-topic-badge" th:text="${faq.topicName}">FAQ 주제</span>
                                            <span th:text="${faq.title}">FAQ 제목</span>

                                            <span class="faq-question__meta">
                                                등록일
                                                <span th:text="${#temporals.format(faq.createdAt, 'yyyy.MM.dd')}">2026.04.15</span>
                                                <span class="faq-question__meta-divider" aria-hidden="true"></span>
                                                조회수
                                                <span class="js-front-faq-view-count" th:text="${faq.viewCount}">0</span>
                                            </span>
                                        </strong>

                                        <span class="faq-open-close"><s></s></span>
                                    </a>

                                    <div class="faq-answer"
                                         th:id="${'A' + faq.id}"
                                         style="display: none;">
                                        <div class="faq-answer__wrap">
                                            <span class="faq-answer__icon">A<em class="blind">답변</em></span>

                                            <div class="faq-answer__box">
                                                <div class="faq-answer__content" th:text="${faq.answer}">
                                                    FAQ 답변
                                                </div>

                                                <div th:if="${faq.linkEnabled and faq.linkUrl != null and !#strings.isEmpty(faq.linkUrl)}"
                                                     class="faq-answer__link-wrap">
                                                    <a th:href="${faq.linkUrl}"
                                                       target="_blank"
                                                       rel="noopener noreferrer">
                                                        관련 링크 바로가기
                                                    </a>
                                                </div>

                                                <div class="faq-answer__updated-at">
                                                    최종 수정일
                                                    <span th:text="${#temporals.format(faq.updatedAt, 'yyyy.MM.dd')}">2026.04.15</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div th:if="${faqPage.empty}" class="faq-empty-state">
                            <strong>검색 결과가 없습니다.</strong>
                            <span>선택한 주제 또는 검색어를 변경해보세요.</span>
                        </div>

                        <ul class="list-pagination" th:if="${faqPage.totalElements > 0}">
                            <span class="arrow">
                                <a th:href="@{/faqPage(page=1, keyword=${keyword}, topicId=${selectedTopicId})}" class="first">
                                    <em class="blind">처음페이지</em>
                                </a>
                                <a th:href="@{/faqPage(page=${currentPage > 1 ? currentPage - 1 : 1}, keyword=${keyword}, topicId=${selectedTopicId})}" class="prev">
                                    <em class="blind">이전페이지</em>
                                </a>
                            </span>

                            <ul class="num-list">
                                <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                                    th:classappend="${pageNum == currentPage} ? 'current on' : ''">
                                    <a th:href="@{/faqPage(page=${pageNum}, keyword=${keyword}, topicId=${selectedTopicId})}"
                                       th:text="${pageNum}">1</a>
                                </li>
                            </ul>

                            <span class="arrow">
                                <a th:href="@{/faqPage(page=${currentPage < faqPage.totalPages ? currentPage + 1 : faqPage.totalPages}, keyword=${keyword}, topicId=${selectedTopicId})}" class="next">
                                    <em class="blind">다음페이지</em>
                                </a>
                                <a th:href="@{/faqPage(page=${faqPage.totalPages}, keyword=${keyword}, topicId=${selectedTopicId})}" class="last">
                                    <em class="blind">마지막페이지</em>
                                </a>
                            </span>
                        </ul>
                    </div>
                </section>
            </section>
        </div>
    </main>

    <footer th:replace="fragments/front/common :: commonFooter"></footer>
</div>

<th:block th:replace="fragments/front/common :: commonScript"></th:block>
<script src="/front/resources/js/faq.js"></script>
</body>
</html>
